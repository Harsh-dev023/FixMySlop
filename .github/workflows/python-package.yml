name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[analysis,dev]" flake8
    - name: Lint (syntax errors / undefined names)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --extend-exclude=examples,test_bait.py
    - name: Test
      run: pytest -q
    - name: FixMySlop scans itself
      run: fixmyslop scan . --fail-on medium
